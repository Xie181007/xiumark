name: Build and publish Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" || -z "${ANDROID_KEY_ALIAS:-}" || \
                -z "${ANDROID_KEY_PASSWORD:-}" || -z "${ANDROID_STORE_PASSWORD:-}" ]]; then
            echo "::error::Set all four Android signing secrets in repository settings."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
          } > android/key.properties

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-pub

      - name: Build release APK
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION#v}"
          flutter build apk --release \
            --build-name "$VERSION" \
            --build-number "$RELEASE_BUILD_NUMBER"

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/XiuMark.apk
          sha256sum dist/XiuMark.apk > dist/SHA256SUMS.txt
          printf 'Version tag: %s\nCommit: %s\nAPK size: %s bytes\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(stat -c '%s' dist/XiuMark.apk)" \
            > dist/BUILD-INFO.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/XiuMark.apk
          dist/SHA256SUMS.txt
          dist/BUILD-INFO.txt
          --verify-tag
          --generate-notes
          --latest
          --title "XiuMark $GITHUB_REF_NAME"
