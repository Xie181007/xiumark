name: xiumark
description: Dokumentasi pekerjaan lapangan Telkom Akses secara privat dan offline-first.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.2
  geolocator: ^14.0.2
  path_provider: ^2.1.5
  path: ^1.9.1
  sqflite: ^2.4.2
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/telkom_akses_logo.png
